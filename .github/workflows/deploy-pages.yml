name: Deploy Web game to GitHub Pages

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: github-pages
  cancel-in-progress: true

env:
  GODOT_VERSION: 4.7.1
  GODOT_RELEASE: stable

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Install Godot and Web export templates
        shell: bash
        run: |
          set -euo pipefail

          godot_root="${RUNNER_TEMP}/godot"
          template_dir="${HOME}/.local/share/godot/export_templates/${GODOT_VERSION}.${GODOT_RELEASE}"
          release_base="https://github.com/godotengine/godot-builds/releases/download/${GODOT_VERSION}-${GODOT_RELEASE}"

          mkdir -p "${godot_root}" "${template_dir}"
          curl --fail --location --retry 3 \
            --output "${godot_root}/godot.zip" \
            "${release_base}/Godot_v${GODOT_VERSION}-${GODOT_RELEASE}_linux.x86_64.zip"
          curl --fail --location --retry 3 \
            --output "${godot_root}/templates.tpz" \
            "${release_base}/Godot_v${GODOT_VERSION}-${GODOT_RELEASE}_export_templates.tpz"

          unzip -q "${godot_root}/godot.zip" -d "${godot_root}"
          unzip -q "${godot_root}/templates.tpz" -d "${godot_root}"
          mv "${godot_root}/Godot_v${GODOT_VERSION}-${GODOT_RELEASE}_linux.x86_64" "${godot_root}/godot"
          mv "${godot_root}/templates/"* "${template_dir}/"
          chmod +x "${godot_root}/godot"
          echo "${godot_root}" >> "${GITHUB_PATH}"

      - name: Import project
        run: godot --headless --editor --path . --quit

      - name: Run playthrough smoke test
        run: godot --headless --path . --rendering-method gl_compatibility -- --playthrough-test

      - name: Export Web build
        run: |
          mkdir -p build/web
          godot --headless --path . --export-release Web build/web/index.html
          touch build/web/.nojekyll

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v6

      - name: Upload GitHub Pages artifact
        uses: actions/upload-pages-artifact@v5
        with:
          path: build/web

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
